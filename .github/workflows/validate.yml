name: Validate public workflow

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate structure, JSON, and privacy boundary
        shell: pwsh
        run: ./scripts/validate-repo.ps1
      - name: Validate macOS audit helper syntax
        shell: bash
        run: bash -n ./scripts/Audit-ObsidianEnvironment-macOS.command
